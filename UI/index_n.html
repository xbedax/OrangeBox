    <script>
        function formatResult(code, params = {}) {
            const values = params && typeof params === "object" ? params : {};
            return tr(code).replace(/<([a-z_]+)>/g, (placeholder, name) =>
                Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : placeholder);
        }
    </script>
    <script>
        const pinsInTable = 15;
        const connIds = ["stateOffline", "statePause", "stateOnline"];
		const codesInTable = 15;
        let doorState = 0;
        let lastConnectionState = 1;
        const checkboxUnlimited = document.getElementById("checkbox-unlimited");
		const checkboxPresence = document.getElementById("checkbox-presence");
		
        let pinForm = document.forms["pinForm"];
        const deadTimeout = 80;       //seconds from last messsage
        const unknownTimeout = 40;       //seconds from last messsage
        var boxClockDrift = 0;
		var dooropenpermitted = 0;
		var setcredpermitted = 0;
        const dateFormat = "YYYY-MM-DD hh:mm";
		const credTypes = ["all", "ctPin", "ctCode"];
        const credPages = Object.create(null);

		function connectionCheck () {
			let currentDelay = Date.now()/1000 - lastContact;
			let newConnectionState = connectionState;
			if ( newConnectionState < 2 && currentDelay > unknownTimeout  ){
			  newConnectionState = 1;
			}
			if ( currentDelay  > deadTimeout  ){
			  newConnectionState = 0;
			}
			//console.log("ConCheck: " + newConnectionState + " / " + lastContact);
			if ( newConnectionState != lastConnectionState) {
			  lastConnectionState = newConnectionState;
			  for (let idx = 0; idx < connIds.length; idx++){
				console.log("-->" + connIds[idx]);
				if (idx == newConnectionState) {
					console.log ("==> " +  connIds[idx])
					document.getElementById(connIds[idx]).removeAttribute('hidden');
				} else {
				   document.getElementById(connIds[idx]).setAttribute('hidden', true);
				}
			  }
			}
		}
		function handleMessage(myObj){
			var command = myObj["_command_"];
			var keys = Object.keys(myObj["data"]);
			if ( command == "c_visibility") {
				for (var i = 0; i < keys.length; i++){
				  var key = keys[i];
				  console.log("Visibility for key: " + key);
				  if ( myObj["data"][key] == 'no') {
					document.getElementById(key).hidden = true;
				  }else{
					document.getElementById(key).hidden = false;
				  }  
				}
			}
			if ( command == "c_ambientstate") {
				console.log("Ambient state: " + myObj["data"]["state"]);
				if ( myObj["data"]["state"] == 'on') {
					document.getElementById('ambient_state_off').hidden = true;
					document.getElementById('ambient_state_on').hidden = false;
				}else{
					document.getElementById('ambient_state_on').hidden = true;
					document.getElementById('ambient_state_off').hidden = false;
				}  
			}
			if ( command == "c_doorstate") {
				console.log("Door state: " + myObj["data"]["door_num"] + " / " + myObj["data"]["state"]);
				if ( myObj["data"]["state"] == 'open') {
					document.getElementById('door_state_closed').hidden = true;
					document.getElementById('door_state_open').hidden = false;
				}else{
					document.getElementById('door_state_open').hidden = true;
					document.getElementById('door_state_closed').hidden = false;
				}  
			}

            if (command === "c_enordis") {
                const permission = myObj.data.opendoor;
                if (permission === "disable" ) {
                    document.querySelectorAll('[data-operation="opendoor"]').forEach(button => {
                        button.disabled = true;
                    });
                }else {
                    document.querySelectorAll('[data-operation="opendoor"]').forEach(button => {
                        button.disabled = false;
                    });
                }
                return;
            }
            if (command === "c_diagnostics" || command === "c_diagnostic_snapshots") {
                const targets = command === "c_diagnostics"
                    ? {html: "diagnostics", text: "diagnostics_text", json: "diagnostics_json"}
                    : {html: "diagnostic_snapshots", text: "diagnostic_snapshots_text",
                       json: "diagnostic_snapshots_json", count: "diagnostic_snapshot_count"};
                for (const [field, id] of Object.entries(targets)) {
                    const element = document.getElementById(id);
                    if (!element || !Object.prototype.hasOwnProperty.call(myObj.data, field)) continue;
                    if (field === "html") element.innerHTML = myObj.data[field];
                    else element.textContent = myObj.data[field];
                }
                return;
            }
            if (command == "c_lastresult") {
                if (typeof myObj.data.lastresult === "string") {
                    document.getElementById("lastresult").textContent = myObj.data.lastresult === ""
                        ? ""
                        : formatResult(myObj.data.lastresult, myObj.data.params);
                }
                return;
            }
			if (command == "c_setcred") {
                const payload = myObj.data;
                if (payload.success === false) return;
                if (payload.changed) {
                    const page = credPages[payload.credType];
                    if (page) getCreds(page.firstCredId, page.credCount, page.type);
                    return;
                }
                if (!payload.rows || !["ctPin", "ctCode"].includes(payload.credType)) return;
				var credType = myObj["data"]["credType"];
				var htmlContent = "";
				var htmlBeacon = "";
				if ( credType == "ctCode" ) {
					var recordSet = myObj["data"]["rows"];
					htmlContent = rowsToTableBody(recordSet, ["codeid", "codename", "codevalue", "codefrom",  "codeto"]);
					htmlBeacon = "coderows";
				}
				if ( credType == "ctPin" ) {
					var recordSet = myObj["data"]["rows"];
					htmlContent = rowsToTableBody(myObj["data"]["rows"], ["pinid", "pinname", "pinvalue", "datefrom",  "dateto", "amount"]);
					htmlBeacon = "pinrows";
				}
				console.log("Produced: " + htmlContent);
				console.log("Changing key: " + htmlBeacon);
				document.getElementById(htmlBeacon).innerHTML = "";
				document.getElementById(htmlBeacon).innerHTML = htmlContent;
			}
			if ( command == "c_content") {
				for (var i = 0; i < keys.length; i++){
					var key = keys[i];
					console.log("Changing key: " + key);
					document.getElementById(key).innerHTML = "";
					document.getElementById(key).innerHTML = myObj["data"][key];
				}
			}
		}
		function stateUpdater () {
			connectionCheck();
			boxClockDrift = 0;
			for (let idx = 0; idx < driftPoolLength; idx++){
			  boxClockDrift = boxClockDrift + driftPool[idx];
			}
			boxClockDrift = boxClockDrift / driftPoolLength;
			const hDate = new Date( Date.now() + boxClockDrift * 1000 );
			const year = hDate.getFullYear();
			const month = String(hDate.getMonth() + 1).padStart(2, '0'); // 0-based → 1-based, pad with leading zero
			const day = String(hDate.getDate()).padStart(2, '0');
			const hours = String(hDate.getHours()).padStart(2, '0');
			const minutes = String(hDate.getMinutes()).padStart(2, '0');
			const seconds = String(hDate.getSeconds()).padStart(2, '0');
			var bDate = 
			  dateFormat.replace('YYYY', year)
				.replace('MM', month)
				.replace('DD', day)
				.replace('hh', hours)
				.replace('mm', minutes) // Note: 'MM' is reused for minutes (matches common formatting)
				.replace('SS', seconds);
			document.getElementById("boxtime").innerHTML= bDate;
		}
		function getCreds (firstCredId, credCount, type) {		
			const data = {};  
			data["credId"] = firstCredId;
			data["credCount"] = credCount;
			data["credType"] = credTypes[type];
            credPages[data["credType"]] = {firstCredId, credCount, type};
			postFormData(data, "get_creds");        
		}
		function getDoorState (doorNum) {
			const data = {};  
			data["doornum"] = doorNum;
			postFormData(data, "get_door");
		}
		function getAmbientState (lightNum) {
			const data = {};  
			data["lightId"] = lightNum;
			postFormData(data, "get_ambient");
		}
		function getStatus () {
			const data = {};  
			data["dummy"] = "-"
			postFormData(data, "get_status");
		}
		  
        function escapeCredText(value) {
            return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
		function rowsToTableBody(rows, cols = Object.keys(rows)) {
			if (cols.length === 0) return '';

			const rowCount = rows[cols[0]].length;
			let html = '';
			for (let i = 0; i < rowCount; i++) {
                html += '<tr>' + cols.map(col => {
                    const value = rows[col][i] ?? '';
                    if (Object.hasOwn(credDateBounds, col)) {
                        const text = value === '' || value === credDateBounds[col] ? tr("L_Unlimited") : value;
                        const raw = escapeCredText(value).replace(/"/g, '&quot;');
                        return `<td data-cred-value="${raw}">${escapeCredText(text)}</td>`;
                    }
                    return `<td>${escapeCredText(value)}</td>`;
                }).join('') + '</tr>\n';
			}
			return html;
		}
	  // Disables/enables Count input according to Unlimitewd checkbox
		function toggleCount(event){
			unlimitedState = !checkboxUnlimited.checked;
			if (unlimitedState) {
			  document.getElementById('amount').disabled = false;
			  document.getElementById('amount').value = "1";
			} else {
			  document.getElementById('amount').disabled = true;
			  document.getElementById('amount').value = "-1";
			};
		}
		function togglePresence(event){
			verifyPresence = checkboxPresence.checked;
			if (verifyPresence) {
			  document.getElementById('presence').disabled = false;
			  document.getElementById('presence').value = "";
			} else {
			  document.getElementById('presence').disabled = true;
			  document.getElementById('presence').value = "X";
			};
		}
					 
		function initializePage(){
			getCreds(0, pinsInTable, 1);
			getCreds(0, codesInTable, 2);
			getDoorState(0);
			getAmbientState(0);
			getStatus();
			addRowHandlers("pin");
			addRowHandlers("code");
			selectedLanguage = getLanguage();
			translatePage();
			window.setInterval (stateUpdater, 2000);
		};

		window.onload=initializePage();
      
    </script>
