; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep+
upload_port = COM3
monitor_port = COM3
monitor_speed = 9600
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps = 
	ESP32Async/AsyncTCP@^3.4.10
	ayushsharma82/ElegantOTA@^3.1.7
	adafruit/Adafruit GFX Library@^1.12.5
	mcendu/LCDI2C_Multilingual_MCD@^2.1.0
	bblanchon/ArduinoJson@^7.2.2
	locple/LiquidCrystal I2C Multilingual@^2.0.2
	aki237/Adafruit_ESP32_SH1106@^1.0.2
	ESP32Async/ESPAsyncWebServer@^3.11.0
	dennis-ard/Arducam_Mega@^2.0.9
