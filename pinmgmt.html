<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>PIN Management</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<h2>PIN management</h2>

<button onclick="openAdd()">Add PIN</button>

<table id="pinTable">
<thead>
<tr>
<th>Name</th>
<th>PIN</th>
<th>From</th>
<th>To</th>
<th>Count</th>
<th>Actions</th>
</tr>
</thead>
<tbody>
</tbody>
</table>


<!-- MODAL -->

<div id="pinModal" class="modal">

<div class="modal-content">

<h3 id="modalTitle"></h3>

<label>Name</label>
<input id="pinName" maxlength="10">

<label>PIN</label>
<input id="pinCode" maxlength="8">

<label>Valid From</label>
<input id="pinFrom" type="datetime-local">

<label>Valid To</label>
<input id="pinTo" type="datetime-local">

<label>Count</label>
<input id="pinCount" type="number">

<br><br>

<button onclick="savePin()">Save</button>
<button onclick="closeModal()">Cancel</button>

</div>

</div>

<script>
  var gateway;
  if (window.location.protocol == "https:") {
    console.log('Hmm secure WebSocket connection needed');
    gateway = `wss://${window.location.hostname}/ws`;
  } else {
    gateway = `ws://${window.location.hostname}/ws`;
  }
  var websocket;
  window.addEventListener('load', onLoad);
  
  function initWebSocket() {
    console.log('Trying to open a WebSocket connection...');
    websocket = new WebSocket(gateway);
    websocket.onopen    = onOpen;
    websocket.onclose   = onClose;
    websocket.onmessage = onMessage; // <-- add this line
  }
    function onOpen(event) {
    console.log('Connection opened');
  }
  function onClose(event) {
    console.log('Connection closed');
    setTimeout(initWebSocket, 2000);
  }
  function onMessage(event) {
    var state;
    var myObj = JSON.parse(event.data);
    console.log('Received');
    console.log(event.data);

     var keys = Object.keys(myObj);

    for (var i = 0; i < keys.length; i++){
        var key = keys[i];
        document.getElementById(key).innerHTML = myObj[key];
    }    
  }
  function onLoad(event) {
    initWebSocket();
    initButton();
  }


</script>

</body>
</html>
